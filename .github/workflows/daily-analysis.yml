name: Advanced Repository Analysis

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/daily-analysis.yml'

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  analyze-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install analysis tools
        continue-on-error: true
        run: |
          echo "=== Installing Analysis Tools ===" > install.log
          
          # Python tools
          pip install --upgrade pip 2>&1 | tee -a install.log
          pip install pylint flake8 bandit radon pytest pytest-cov pip-audit safety 2>&1 | tee -a install.log || echo "Warning: Some Python tools failed"
          
          # Node.js tools
          if command -v npm &> /dev/null; then
            npm install -g jshint markdownlint-cli 2>&1 | tee -a install.log || echo "Warning: Some Node tools failed"
          fi
          
          echo "Installation complete"
      
      - name: Create advanced analysis script
        run: |
          cat > analyze_repo.py << 'PYTHON_SCRIPT_EOF'
          """
          Advanced Repository Analysis with Self-Healing & Metrics
          """
          import os
          import json
          import subprocess
          import sys
          from pathlib import Path
          from datetime import datetime, timedelta
          from typing import Dict, List, Tuple, Any, Optional
          import traceback
          import re

          class AdvancedRepositoryAnalyzer:
              """Enhanced analyzer with complexity metrics and self-healing"""
              
              def __init__(self):
                  self.root_path = Path('.')
                  self.results = {
                      'timestamp': datetime.now().isoformat(),
                      'errors': [],
                      'warnings': [],
                      'stats': {},
                      'complexity_metrics': {},
                      'test_coverage': {},
                      'security_issues': [],
                      'dependency_health': {},
                      'file_insights': [],
                      'recent_changes': [],
                      'tools_available': {},
                      'self_healing_actions': [],
                      'analysis_metadata': {
                          'first_run': False,
                          'tools_installed': [],
                          'tools_failed': [],
                          'files_scanned': 0,
                          'files_skipped': 0
                      }
                  }
                  self.excluded_dirs = {
                      '.git', 'node_modules', 'venv', '__pycache__', 
                      '.pytest_cache', 'dist', 'build', '.eggs',
                      'env', '.env', 'vendor', 'target', 'coverage'
                  }
                  self.history_file = Path('.github/analysis_history.json')
              
              def run_command(self, cmd: str, timeout: int = 60) -> Tuple[str, str, int]:
                  """Safely run shell command"""
                  try:
                      result = subprocess.run(
                          cmd, 
                          shell=True, 
                          capture_output=True, 
                          text=True, 
                          timeout=timeout,
                          cwd=str(self.root_path)
                      )
                      return result.stdout, result.stderr, result.returncode
                  except subprocess.TimeoutExpired:
                      return "", f"Timeout after {timeout}s", 1
                  except Exception as e:
                      return "", str(e), 1
              
              def is_tool_available(self, tool: str) -> bool:
                  """Check if tool is available"""
                  stdout, _, code = self.run_command(f"which {tool}")
                  available = code == 0 and stdout.strip() != ""
                  self.results['tools_available'][tool] = available
                  
                  if available:
                      self.results['analysis_metadata']['tools_installed'].append(tool)
                  else:
                      self.results['analysis_metadata']['tools_failed'].append(tool)
                  
                  return available
              
              def should_skip_path(self, path: Path) -> bool:
                  """Check if path should be skipped"""
                  path_str = str(path)
                  return any(excluded in path.parts for excluded in self.excluded_dirs)
              
              def find_files_by_extension(self, *extensions: str, limit: int = 200) -> List[Path]:
                  """Find files with given extensions"""
                  files = []
                  try:
                      for ext in extensions:
                          for file in self.root_path.rglob(ext):
                              if len(files) >= limit:
                                  break
                              if not self.should_skip_path(file) and file.is_file():
                                  files.append(file)
                                  self.results['analysis_metadata']['files_scanned'] += 1
                              else:
                                  self.results['analysis_metadata']['files_skipped'] += 1
                  except Exception as e:
                      self.results['warnings'].append(f"Error scanning for {extensions}: {str(e)}")
                  
                  return files
              
              def analyze_code_complexity(self) -> None:
                  """Analyze code complexity using radon"""
                  print("📊 Analyzing code complexity...")
                  
                  if not self.is_tool_available('radon'):
                      return
                  
                  py_files = self.find_files_by_extension('*.py')
                  
                  complexity_data = {
                      'cyclomatic_complexity': {},
                      'maintainability_index': {},
                      'high_complexity_files': [],
                      'low_maintainability_files': []
                  }
                  
                  for file in py_files[:50]:
                      try:
                          # Cyclomatic complexity
                          stdout, _, code = self.run_command(f'radon cc "{file}" -j')
                          if code == 0 and stdout.strip():
                              cc_data = json.loads(stdout)
                              if cc_data and str(file) in cc_data:
                                  avg_complexity = sum(f['complexity'] for f in cc_data[str(file)]) / len(cc_data[str(file)]) if cc_data[str(file)] else 0
                                  complexity_data['cyclomatic_complexity'][str(file)] = round(avg_complexity, 2)
                                  
                                  if avg_complexity > 10:
                                      complexity_data['high_complexity_files'].append({
                                          'file': str(file),
                                          'complexity': round(avg_complexity, 2)
                                      })
                          
                          # Maintainability index
                          stdout, _, code = self.run_command(f'radon mi "{file}" -j')
                          if code == 0 and stdout.strip():
                              mi_data = json.loads(stdout)
                              if mi_data and str(file) in mi_data:
                                  mi_score = mi_data[str(file)]['mi']
                                  rank = mi_data[str(file)]['rank']
                                  complexity_data['maintainability_index'][str(file)] = {
                                      'score': round(mi_score, 2),
                                      'rank': rank
                                  }
                                  
                                  if rank in ['C', 'D', 'F']:
                                      complexity_data['low_maintainability_files'].append({
                                          'file': str(file),
                                          'score': round(mi_score, 2),
                                          'rank': rank
                                      })
                      
                      except json.JSONDecodeError:
                          pass
                      except Exception as e:
                          self.results['warnings'].append(f"Complexity analysis failed for {file}: {str(e)}")
                  
                  # Calculate averages
                  if complexity_data['cyclomatic_complexity']:
                      complexity_data['average_complexity'] = round(
                          sum(complexity_data['cyclomatic_complexity'].values()) / 
                          len(complexity_data['cyclomatic_complexity']), 2
                      )
                  
                  if complexity_data['maintainability_index']:
                      scores = [v['score'] for v in complexity_data['maintainability_index'].values()]
                      complexity_data['average_maintainability'] = round(sum(scores) / len(scores), 2)
                  
                  self.results['complexity_metrics'] = complexity_data
              
              def detect_and_run_tests(self) -> None:
                  """Detect tests and run coverage analysis"""
                  print("🧪 Detecting and running tests...")
                  
                  test_dirs = ['tests', 'test', 'spec']
                  has_tests = any(Path(d).exists() for d in test_dirs)
                  
                  if not has_tests:
                      has_tests = len(self.find_files_by_extension('*test*.py', '*.test.js', limit=5)) > 0
                  
                  coverage_data = {
                      'has_tests': has_tests,
                      'coverage_percent': 0,
                      'covered_lines': 0,
                      'total_lines': 0,
                      'missing_coverage_files': []
                  }
                  
                  if has_tests and self.is_tool_available('pytest'):
                      try:
                          # Run pytest with coverage
                          stdout, stderr, code = self.run_command(
                              'pytest --cov=. --cov-report=json --cov-report=term -v',
                              timeout=120
                          )
                          
                          # Read coverage report
                          cov_file = Path('coverage.json')
                          if cov_file.exists():
                              with open(cov_file, 'r') as f:
                                  cov_report = json.load(f)
                              
                              coverage_data['coverage_percent'] = round(cov_report['totals']['percent_covered'], 2)
                              coverage_data['covered_lines'] = cov_report['totals']['covered_lines']
                              coverage_data['total_lines'] = cov_report['totals']['num_statements']
                              
                              # Find files with low coverage
                              for file_path, file_data in cov_report['files'].items():
                                  if file_data['summary']['percent_covered'] < 50:
                                      coverage_data['missing_coverage_files'].append({
                                          'file': file_path,
                                          'coverage': round(file_data['summary']['percent_covered'], 2)
                                      })
                              
                              cov_file.unlink()  # Clean up
                      
                      except Exception as e:
                          self.results['warnings'].append(f"Test coverage analysis failed: {str(e)}")
                  
                  self.results['test_coverage'] = coverage_data
              
              def scan_security_vulnerabilities(self) -> None:
                  """Scan for security vulnerabilities"""
                  print("🔒 Scanning for security vulnerabilities...")
                  
                  security_issues = []
                  
                  # Python: pip-audit
                  if self.is_tool_available('pip-audit'):
                      try:
                          stdout, stderr, code = self.run_command('pip-audit --format json', timeout=120)
                          if stdout.strip():
                              audit_data = json.loads(stdout)
                              for vuln in audit_data.get('vulnerabilities', []):
                                  security_issues.append({
                                      'type': 'python',
                                      'package': vuln.get('name', 'unknown'),
                                      'version': vuln.get('version', 'unknown'),
                                      'vulnerability': vuln.get('id', 'unknown'),
                                      'severity': 'high'
                                  })
                      except Exception as e:
                          self.results['warnings'].append(f"pip-audit failed: {str(e)}")
                  
                  # Python: bandit for code security
                  if self.is_tool_available('bandit'):
                      py_files = self.find_files_by_extension('*.py')
                      if py_files:
                          try:
                              stdout, stderr, code = self.run_command('bandit -r . -f json -ll', timeout=60)
                              if stdout.strip():
                                  bandit_data = json.loads(stdout)
                                  for issue in bandit_data.get('results', [])[:10]:
                                      security_issues.append({
                                          'type': 'code',
                                          'file': issue.get('filename', 'unknown'),
                                          'line': issue.get('line_number', 0),
                                          'issue': issue.get('issue_text', 'Security issue'),
                                          'severity': issue.get('issue_severity', 'unknown').lower()
                                      })
                          except Exception as e:
                              pass
                  
                  # Node.js: npm audit
                  if Path('package.json').exists() and self.is_tool_available('npm'):
                      try:
                          stdout, stderr, code = self.run_command('npm audit --json', timeout=60)
                          if stdout.strip():
                              npm_audit = json.loads(stdout)
                              for vuln_id, vuln in npm_audit.get('vulnerabilities', {}).items():
                                  security_issues.append({
                                      'type': 'node',
                                      'package': vuln.get('name', 'unknown'),
                                      'severity': vuln.get('severity', 'unknown'),
                                      'vulnerability': vuln_id
                                  })
                      except Exception as e:
                          pass
                  
                  self.results['security_issues'] = security_issues[:20]  # Limit to 20
              
              def check_dependency_health(self) -> None:
                  """Check dependency health and outdated packages"""
                  print("📦 Checking dependency health...")
                  
                  health_data = {
                      'python': {'total': 0, 'outdated': []},
                      'node': {'total': 0, 'outdated': []}
                  }
                  
                  # Python dependencies
                  if Path('requirements.txt').exists():
                      try:
                          stdout, _, _ = self.run_command('pip list --format json')
                          if stdout.strip():
                              packages = json.loads(stdout)
                              health_data['python']['total'] = len(packages)
                          
                          stdout, _, _ = self.run_command('pip list --outdated --format json', timeout=60)
                          if stdout.strip():
                              outdated = json.loads(stdout)
                              health_data['python']['outdated'] = [
                                  {
                                      'name': p['name'],
                                      'current': p['version'],
                                      'latest': p['latest_version']
                                  }
                                  for p in outdated[:10]
                              ]
                      except Exception as e:
                          pass
                  
                  # Node.js dependencies
                  if Path('package.json').exists() and self.is_tool_available('npm'):
                      try:
                          stdout, _, _ = self.run_command('npm list --json --depth=0')
                          if stdout.strip():
                              npm_list = json.loads(stdout)
                              health_data['node']['total'] = len(npm_list.get('dependencies', {}))
                          
                          stdout, _, _ = self.run_command('npm outdated --json', timeout=60)
                          if stdout.strip():
                              outdated = json.loads(stdout)
                              health_data['node']['outdated'] = [
                                  {
                                      'name': name,
                                      'current': data.get('current', 'unknown'),
                                      'latest': data.get('latest', 'unknown')
                                  }
                                  for name, data in list(outdated.items())[:10]
                              ]
                      except Exception as e:
                          pass
                  
                  self.results['dependency_health'] = health_data
              
              def generate_file_insights(self) -> None:
                  """Generate file-level insights"""
                  print("📁 Generating file insights...")
                  
                  insights = []
                  
                  # Find largest files
                  try:
                      stdout, _, _ = self.run_command(
                          'find . -type f -not -path "*/.*" -not -path "*/node_modules/*" -exec du -h {} + | sort -rh | head -10'
                      )
                      
                      if stdout:
                          for line in stdout.strip().split('\n'):
                              parts = line.split('\t', 1)
                              if len(parts) == 2:
                                  insights.append({
                                      'type': 'large_file',
                                      'file': parts[1],
                                      'size': parts[0]
                                  })
                  except Exception as e:
                      pass
                  
                  self.results['file_insights'] = insights[:10]
              
              def get_recent_changes(self) -> None:
                  """Get recent git commits"""
                  print("📝 Fetching recent changes...")
                  
                  try:
                      stdout, _, code = self.run_command('git log --pretty=format:"%h|%an|%ar|%s" -n 10')
                      if code == 0 and stdout:
                          changes = []
                          for line in stdout.strip().split('\n'):
                              parts = line.split('|', 3)
                              if len(parts) == 4:
                                  changes.append({
                                      'hash': parts[0],
                                      'author': parts[1],
                                      'time': parts[2],
                                      'message': parts[3]
                                  })
                          self.results['recent_changes'] = changes
                  except Exception as e:
                      pass
              
              def self_healing_mode(self) -> None:
                  """Auto-generate missing essential files"""
                  print("🔧 Running self-healing checks...")
                  
                  actions = []
                  
                  # Generate .gitignore if missing
                  gitignore = Path('.gitignore')
                  if not gitignore.exists():
                      default_gitignore = """# Python
          __pycache__/
          *.py[cod]
          *$py.class
          venv/
          env/
          .env
          *.egg-info/
          dist/
          build/
          
          # Node
          node_modules/
          npm-debug.log
          
          # IDEs
          .vscode/
          .idea/
          *.swp
          *.swo
          
          # OS
          .DS_Store
          Thumbs.db
          
          # Testing
          .coverage
          htmlcov/
          .pytest_cache/
          """
                      try:
                          gitignore.write_text(default_gitignore)
                          actions.append('Created .gitignore')
                      except Exception as e:
                          pass
                  
                  # Generate requirements.txt if Python files exist but no requirements
                  requirements = Path('requirements.txt')
                  py_files = self.find_files_by_extension('*.py', limit=5)
                  if py_files and not requirements.exists():
                      try:
                          stdout, _, _ = self.run_command('pip freeze')
                          if stdout:
                              requirements.write_text(stdout)
                              actions.append('Created requirements.txt')
                      except Exception as e:
                          pass
                  
                  self.results['self_healing_actions'] = actions
              
              def save_historical_data(self) -> None:
                  """Save analysis history for trend tracking"""
                  try:
                      history = []
                      
                      # Load existing history
                      if self.history_file.exists():
                          with open(self.history_file, 'r') as f:
                              history = json.load(f)
                      
                      # Add current data point
                      history.append({
                          'timestamp': self.results['timestamp'],
                          'error_count': len(self.results['errors']),
                          'warning_count': len(self.results['warnings']),
                          'security_issues': len(self.results['security_issues']),
                          'total_lines': self.results['stats'].get('total_lines', 0),
                          'repository_size_mb': self.results['stats'].get('repository_size_mb', 0),
                          'test_coverage': self.results['test_coverage'].get('coverage_percent', 0),
                          'average_complexity': self.results['complexity_metrics'].get('average_complexity', 0),
                          'average_maintainability': self.results['complexity_metrics'].get('average_maintainability', 0)
                      })
                      
                      # Keep only last 30 days
                      cutoff = datetime.now() - timedelta(days=30)
                      history = [
                          h for h in history 
                          if datetime.fromisoformat(h['timestamp']) > cutoff
                      ]
                      
                      # Save
                      self.history_file.parent.mkdir(parents=True, exist_ok=True)
                      with open(self.history_file, 'w') as f:
                          json.dump(history, f, indent=2)
                      
                      self.results['historical_trends'] = history
                  
                  except Exception as e:
                      self.results['warnings'].append(f"Failed to save history: {str(e)}")
              
              def collect_repository_stats(self) -> None:
                  """Collect comprehensive repository statistics"""
                  stats = {
                      'total_files': 0,
                      'python_files': 0,
                      'javascript_files': 0,
                      'typescript_files': 0,
                      'markdown_files': 0,
                      'json_files': 0,
                      'yaml_files': 0,
                      'last_commit': 'N/A',
                      'total_lines': 0,
                      'repository_size_mb': 0,
                      'has_tests': False,
                      'has_ci': False,
                      'has_docker': False
                  }
                  
                  try:
                      file_patterns = {
                          'python_files': ['*.py'],
                          'javascript_files': ['*.js', '*.jsx'],
                          'typescript_files': ['*.ts', '*.tsx'],
                          'markdown_files': ['*.md'],
                          'json_files': ['*.json'],
                          'yaml_files': ['*.yml', '*.yaml']
                      }
                      
                      for key, patterns in file_patterns.items():
                          files = self.find_files_by_extension(*patterns, limit=1000)
                          stats[key] = len(files)
                          stats['total_files'] += len(files)
                      
                      stdout, _, code = self.run_command('git log -1 --format="%h - %s (%ar)"')
                      if code == 0 and stdout.strip():
                          stats['last_commit'] = stdout.strip()
                      
                      extensions = ['py', 'js', 'jsx', 'ts', 'tsx', 'java', 'c', 'cpp', 'go', 'rs']
                      find_cmd = ' -o '.join([f'-name "*.{ext}"' for ext in extensions])
                      stdout, _, _ = self.run_command(
                          f'find . -type f \\( {find_cmd} \\) -not -path "*/.*" -not -path "*/node_modules/*" | xargs wc -l 2>/dev/null | tail -1'
                      )
                      
                      if stdout.strip():
                          try:
                              stats['total_lines'] = int(stdout.split()[0])
                          except (ValueError, IndexError):
                              pass
                      
                      stats['has_tests'] = any([
                          Path('tests').exists(),
                          Path('test').exists(),
                          len(self.find_files_by_extension('*test*.py', '*.test.js', limit=5)) > 0
                      ])
                      
                      stats['has_ci'] = Path('.github/workflows').exists()
                      stats['has_docker'] = Path('Dockerfile').exists()
                      
                      stdout, _, _ = self.run_command('du -sm . 2>/dev/null')
                      if stdout:
                          try:
                              stats['repository_size_mb'] = int(stdout.split()[0])
                          except (ValueError, IndexError):
                              pass
                  
                  except Exception as e:
                      self.results['warnings'].append(f"Stats error: {str(e)}")
                  
                  self.results['stats'] = stats
              
              def detect_first_run(self) -> bool:
                  """Detect first run"""
                  marker_file = Path('.github/.analysis_marker')
                  
                  if marker_file.exists():
                      return False
                  
                  try:
                      marker_file.parent.mkdir(parents=True, exist_ok=True)
                      marker_file.write_text(datetime.now().isoformat())
                      return True
                  except Exception as e:
                      return False
              
              def run_analysis(self) -> Dict[str, Any]:
                  """Run complete advanced analysis"""
                  print("=" * 70)
                  print("Advanced Repository Analysis")
                  print("=" * 70)
                  
                  try:
                      self.results['analysis_metadata']['first_run'] = self.detect_first_run()
                      
                      if self.results['analysis_metadata']['first_run']:
                          print("ℹ️  First run - initializing analysis system")
                      
                      self.collect_repository_stats()
                      self.analyze_code_complexity()
                      self.detect_and_run_tests()
                      self.scan_security_vulnerabilities()
                      self.check_dependency_health()
                      self.generate_file_insights()
                      self.get_recent_changes()
                      self.self_healing_mode()
                      self.save_historical_data()
                      
                      print("\n" + "=" * 70)
                      print(f"✅ Analysis Complete!")
                      print(f"  Errors: {len(self.results['errors'])}")
                      print(f"  Warnings: {len(self.results['warnings'])}")
                      print(f"  Security Issues: {len(self.results['security_issues'])}")
                      print(f"  Files Scanned: {self.results['analysis_metadata']['files_scanned']}")
                      print(f"  Self-Healing Actions: {len(self.results['self_healing_actions'])}")
                      print("=" * 70)
                      
                  except Exception as e:
                      print(f"\n❌ Critical error: {str(e)}")
                      print(traceback.format_exc())
                  
                  return self.results
              
              def save_results(self, filename: str = 'analysis_results.json') -> None:
                  """Save results to file"""
                  try:
                      with open(filename, 'w') as f:
                          json.dump(self.results, f, indent=2, default=str)
                      print(f"\n✅ Results saved to {filename}")
                  except Exception as e:
                      print(f"\n❌ Failed to save: {str(e)}")
              
              def set_github_output(self) -> None:
                  """Set GitHub Actions outputs"""
                  try:
                      output_file = os.environ.get('GITHUB_OUTPUT')
                      if output_file:
                          with open(output_file, 'a') as f:
                              f.write(f"error_count={len(self.results['errors'])}\n")
                              f.write(f"warning_count={len(self.results['warnings'])}\n")
                              f.write(f"security_issues={len(self.results['security_issues'])}\n")
                              f.write(f"first_run={str(self.results['analysis_metadata']['first_run']).lower()}\n")
                  except Exception as e:
                      pass

          if __name__ == "__main__":
              analyzer = AdvancedRepositoryAnalyzer()
              results = analyzer.run_analysis()
              analyzer.save_results()
              analyzer.set_github_output()
              sys.exit(0)
          PYTHON_SCRIPT_EOF
          
          echo "✅ Advanced analysis script created"
      
      - name: Run advanced analysis
        id: analysis
        continue-on-error: true
        run: python analyze_repo.py
      
      - name: Generate changelog
        continue-on-error: true
        run: |
          python - << 'EOF'
          from datetime import datetime, timedelta
          from pathlib import Path
          import subprocess
          import re

          def run_cmd(cmd):
              try:
                  result = subprocess.run(cmd, shell=True, capture_output=True, text=True, timeout=30)
                  return result.stdout, result.returncode
              except:
                  return "", 1

          changelog_path = Path('CHANGELOG.md')
          
          # Get commits from last 30 days
          since = (datetime.now() - timedelta(days=30)).strftime('%Y-%m-%d')
          stdout, code = run_cmd(f'git log --since="{since}" --pretty=format:"%h|%ad|%an|%s" --date=short')
          
          if code == 0 and stdout:
              # Parse commits
              commits_by_date = {}
              for line in stdout.strip().split('\n'):
                  parts = line.split('|', 3)
                  if len(parts) == 4:
                      hash_val, date, author, message = parts
                      
                      if date not in commits_by_date:
                          commits_by_date[date] = []
                      
                      commits_by_date[date].append({
                          'hash': hash_val,
                          'author': author,
                          'message': message
                      })
              
              # Generate changelog
              changelog = f"""# Changelog

All notable changes to this project will be documented in this file.

*Auto-generated by GitHub Actions*

"""
              
              for date in sorted(commits_by_date.keys(), reverse=True):
                  changelog += f"\n## [{date}]\n\n"
                  
                  for commit in commits_by_date[date]:
                      msg = commit['message']
                      
                      # Categorize commit
                      if any(word in msg.lower() for word in ['fix', 'bug', 'patch']):
                          prefix = '🐛 **Fixed:**'
                      elif any(word in msg.lower() for word in ['feat', 'add', 'new']):
                          prefix = '✨ **Added:**'
                      elif any(word in msg.lower() for word in ['update', 'change', 'modify']):
                          prefix = '♻️ **Changed:**'
                      elif any(word in msg.lower() for word in ['doc', 'readme']):
                          prefix = '📚 **Documentation:**'
                      elif any(word in msg.lower() for word in ['test']):
                          prefix = '✅ **Testing:**'
                      else:
                          prefix = '🔧'
                      
                      changelog += f"- {prefix} {msg} ([`{commit['hash']}`](../../commit/{commit['hash']}))\n"
              
              changelog += f"\n---\n\n*Last updated: {datetime.now().strftime('%Y-%m-%d %H:%M UTC')}*\n"
              
              # Save changelog
              changelog_path.write_text(changelog)
              print("✅ CHANGELOG.md updated")
          else:
              print("⚠️ No git history available")
          EOF
      
      - name: Create advanced README updater
        run: |
          cat > update_readme.py << 'PYTHON_SCRIPT_EOF'
          """
          Advanced README updater with comprehensive sections
          """
          import json
          from datetime import datetime
          from pathlib import Path
          from typing import Dict, Any
          import re

          class AdvancedReadmeUpdater:
              """Enhanced README updater with all new features"""
              
              ANALYSIS_MARKER_START = "<!-- AUTO-ANALYSIS-START -->"
              ANALYSIS_MARKER_END = "<!-- AUTO-ANALYSIS-END -->"
              
              def __init__(self, results_file: str = 'analysis_results.json'):
                  self.results_file = Path(results_file)
                  self.readme_path = Path('README.md')
                  self.results = self.load_results()
              
              def load_results(self) -> Dict[str, Any]:
                  """Load analysis results"""
                  try:
                      if not self.results_file.exists():
                          return self.empty_results()
                      
                      with open(self.results_file, 'r') as f:
                          return json.load(f)
                  except Exception as e:
                      print(f"⚠️  Error loading results: {e}")
                      return self.empty_results()
              
              def empty_results(self):
                  return {
                      'timestamp': datetime.now().isoformat(),
                      'errors': [], 'warnings': [], 'stats': {},
                      'complexity_metrics': {}, 'test_coverage': {},
                      'security_issues': [], 'dependency_health': {},
                      'file_insights': [], 'recent_changes': [],
                      'self_healing_actions': [],
                      'historical_trends': [],
                      'analysis_metadata': {'first_run': True}
                  }
              
              def detect_project_name(self) -> str:
                  """Detect project name"""
                  import subprocess
                  
                  try:
                      result = subprocess.run(
                          ['git', 'config', '--get', 'remote.origin.url'],
                          capture_output=True, text=True, timeout=5
                      )
                      if result.returncode == 0:
                          url = result.stdout.strip()
                          match = re.search(r'/([^/]+?)(?:\.git)?, url)
                          if match:
                              return match.group(1).replace('-', ' ').replace('_', ' ').title()
                  except:
                      pass
                  
                  try:
                      return Path.cwd().name.replace('-', ' ').replace('_', ' ').title()
                  except:
                      return "Project Repository"
              
              def create_default_readme(self) -> str:
                  """Create default README"""
                  project_name = self.detect_project_name()
                  return f"""# {project_name}

Welcome to {project_name}! This README was automatically generated.

## About

Add your project description here.

## Getting Started

Add installation and usage instructions here.

"""
              
              def read_existing_readme(self) -> str:
                  """Read existing or create new README"""
                  if self.readme_path.exists():
                      try:
                          with open(self.readme_path, 'r', encoding='utf-8') as f:
                              return f.read()
                      except Exception as e:
                          return self.create_default_readme()
                  else:
                      print("ℹ️  Creating new README.md")
                      return self.create_default_readme()
              
              def remove_old_analysis_section(self, content: str) -> str:
                  """Remove old analysis section"""
                  pattern = f"{re.escape(self.ANALYSIS_MARKER_START)}.*?{re.escape(self.ANALYSIS_MARKER_END)}"
                  content = re.sub(pattern, '', content, flags=re.DOTALL)
                  return content.rstrip() + "\n\n"
              
              def generate_trends_chart(self) -> str:
                  """Generate ASCII trend chart"""
                  trends = self.results.get('historical_trends', [])
                  
                  if len(trends) < 2:
                      return ""
                  
                  chart = "\n### 📈 Trends (Last 30 Days)\n\n"
                  
                  # Error trend
                  error_counts = [t['error_count'] for t in trends[-7:]]
                  if error_counts:
                      max_errors = max(error_counts) if max(error_counts) > 0 else 1
                      chart += "**Errors:** "
                      chart += ''.join(['█' if e > 0 else '▁' for e in error_counts])
                      chart += f" (Current: {error_counts[-1]})\n"
                  
                  # Coverage trend
                  coverage = [t.get('test_coverage', 0) for t in trends[-7:]]
                  if any(coverage):
                      chart += f"**Test Coverage:** {coverage[-1]:.1f}% "
                      
                      if len(coverage) > 1:
                          change = coverage[-1] - coverage[-2]
                          if change > 0:
                              chart += f"📈 +{change:.1f}%"
                          elif change < 0:
                              chart += f"📉 {change:.1f}%"
                      chart += "\n"
                  
                  # Lines of code trend
                  loc = [t.get('total_lines', 0) for t in trends[-7:]]
                  if any(loc):
                      chart += f"**Lines of Code:** {loc[-1]:,} "
                      
                      if len(loc) > 1 and loc[-2] > 0:
                          change_pct = ((loc[-1] - loc[-2]) / loc[-2]) * 100
                          if abs(change_pct) > 0.1:
                              chart += f"({'📈' if change_pct > 0 else '📉'} {change_pct:+.1f}%)"
                      chart += "\n"
                  
                  return chart
              
              def generate_analysis_section(self) -> str:
                  """Generate comprehensive analysis section"""
                  stats = self.results.get('stats', {})
                  errors = self.results.get('errors', [])
                  warnings = self.results.get('warnings', [])
                  security = self.results.get('security_issues', [])
                  complexity = self.results.get('complexity_metrics', {})
                  coverage = self.results.get('test_coverage', {})
                  deps = self.results.get('dependency_health', {})
                  changes = self.results.get('recent_changes', [])
                  insights = self.results.get('file_insights', [])
                  healing = self.results.get('self_healing_actions', [])
                  
                  error_count = len(errors)
                  warning_count = len(warnings)
                  security_count = len(security)
                  
                  try:
                      timestamp = datetime.fromisoformat(self.results['timestamp'])
                      timestamp_str = timestamp.strftime('%Y-%m-%d %H:%M UTC')
                  except:
                      timestamp_str = "Unknown"
                  
                  # Status determination
                  if security_count > 5:
                      status_emoji, status_text, status_color = '🔴', f'{security_count} Security Issues', '🔴'
                  elif error_count > 0:
                      status_emoji, status_text, status_color = '❌', f'{error_count} Errors', '🔴'
                  elif warning_count > 5:
                      status_emoji, status_text, status_color = '⚠️', f'{warning_count} Warnings', '🟡'
                  else:
                      status_emoji, status_text, status_color = '✅', 'Healthy', '🟢'
                  
                  section = f"""{self.ANALYSIS_MARKER_START}

---

## 📊 Automated Repository Analysis

<div align="center">

{status_color} **Status:** {status_emoji} **{status_text}**  
🕒 **Last Analysis:** {timestamp_str}

</div>

"""
                  
                  # Self-healing notice
                  if healing:
                      section += f"""
> 🔧 **Self-Healing Actions Taken:** {', '.join(healing)}

"""
                  
                  # Main statistics table
                  section += "### 📈 Project Statistics\n\n"
                  section += "| Metric | Value | Status |\n|--------|-------|--------|\n"
                  
                  if stats:
                      section += f"| **Total Files** | {stats.get('total_files', 0)} | - |\n"
                      section += f"| **Lines of Code** | {stats.get('total_lines', 0):,} | - |\n"
                      section += f"| **Repository Size** | {stats.get('repository_size_mb', 0)} MB | - |\n"
                      
                      if coverage.get('has_tests'):
                          cov_pct = coverage.get('coverage_percent', 0)
                          cov_status = '🟢' if cov_pct >= 80 else '🟡' if cov_pct >= 60 else '🔴'
                          section += f"| **Test Coverage** | {cov_pct:.1f}% | {cov_status} |\n"
                      else:
                          section += "| **Test Coverage** | No tests | 🔴 |\n"
                      
                      if complexity.get('average_maintainability'):
                          mi = complexity['average_maintainability']
                          mi_status = '🟢' if mi >= 20 else '🟡' if mi >= 10 else '🔴'
                          section += f"| **Maintainability Index** | {mi:.1f} | {mi_status} |\n"
                      
                      if complexity.get('average_complexity'):
                          cc = complexity['average_complexity']
                          cc_status = '🟢' if cc <= 5 else '🟡' if cc <= 10 else '🔴'
                          section += f"| **Avg Cyclomatic Complexity** | {cc:.1f} | {cc_status} |\n"
                      
                      section += f"| **Security Issues** | {security_count} | {'🔴' if security_count > 0 else '🟢'} |\n"
                  
                  # Trends
                  trends_chart = self.generate_trends_chart()
                  if trends_chart:
                      section += trends_chart
                  
                  # Code quality details
                  if complexity:
                      high_complexity = complexity.get('high_complexity_files', [])
                      low_maintain = complexity.get('low_maintainability_files', [])
                      
                      if high_complexity or low_maintain:
                          section += "\n### ⚠️ Code Quality Concerns\n\n"
                          
                          if high_complexity:
                              section += "<details>\n<summary>High Complexity Files</summary>\n\n"
                              for item in high_complexity[:5]:
                                  section += f"- `{item['file']}` (Complexity: {item['complexity']})\n"
                              section += "\n</details>\n\n"
                          
                          if low_maintain:
                              section += "<details>\n<summary>Low Maintainability Files</summary>\n\n"
                              for item in low_maintain[:5]:
                                  section += f"- `{item['file']}` (Score: {item['score']}, Rank: {item['rank']})\n"
                              section += "\n</details>\n\n"
                  
                  # Security issues
                  if security_count > 0:
                      section += f"\n### 🔒 Security Vulnerabilities ({security_count})\n\n"
                      
                      section += "<details>\n<summary>Click to expand security issues</summary>\n\n"
                      
                      for issue in security[:10]:
                          if issue.get('type') == 'python' or issue.get('type') == 'node':
                              section += f"- **{issue.get('package', 'Unknown')}** "
                              section += f"({issue.get('version', 'unknown')}) - "
                              section += f"{issue.get('vulnerability', 'Security issue')} "
                              section += f"[{issue.get('severity', 'unknown').upper()}]\n"
                          elif issue.get('type') == 'code':
                              section += f"- `{issue.get('file', 'Unknown')}:{issue.get('line', '?')}` - "
                              section += f"{issue.get('issue', 'Security issue')} "
                              section += f"[{issue.get('severity', 'unknown').upper()}]\n"
                      
                      if security_count > 10:
                          section += f"\n*...and {security_count - 10} more*\n"
                      
                      section += "\n</details>\n\n"
                  
                  # Dependency health
                  if deps.get('python', {}).get('outdated') or deps.get('node', {}).get('outdated'):
                      section += "\n### 📦 Dependency Health\n\n"
                      
                      py_deps = deps.get('python', {})
                      if py_deps.get('outdated'):
                          section += f"**Python:** {len(py_deps['outdated'])} outdated packages\n"
                          section += "<details>\n<summary>View outdated Python packages</summary>\n\n"
                          for pkg in py_deps['outdated'][:10]:
                              section += f"- `{pkg['name']}`: {pkg['current']} → {pkg['latest']}\n"
                          section += "\n</details>\n\n"
                      
                      node_deps = deps.get('node', {})
                      if node_deps.get('outdated'):
                          section += f"**Node.js:** {len(node_deps['outdated'])} outdated packages\n"
                          section += "<details>\n<summary>View outdated Node packages</summary>\n\n"
                          for pkg in node_deps['outdated'][:10]:
                              section += f"- `{pkg['name']}`: {pkg['current']} → {pkg['latest']}\n"
                          section += "\n</details>\n\n"
                  
                  # File insights
                  if insights:
                      section += "\n### 📁 File Insights\n\n"
                      section += "<details>\n<summary>Largest Files</summary>\n\n"
                      for insight in insights[:5]:
                          section += f"- `{insight['file']}` ({insight['size']})\n"
                      section += "\n</details>\n\n"
                  
                  # Recent changes
                  if changes:
                      section += "\n### 📝 Recent Changes\n\n"
                      for change in changes[:5]:
                          section += f"- [`{change['hash']}`](../../commit/{change['hash']}) "
                          section += f"{change['message']} "
                          section += f"*({change['time']} by {change['author']})*\n"
                      
                      if Path('CHANGELOG.md').exists():
                          section += "\n[View Full Changelog →](CHANGELOG.md)\n"
                  
                  # Footer
                  section += f"""
---

<div align="center">
  <sub>🤖 Automated analysis powered by <a href=".github/workflows/daily-analysis.yml">GitHub Actions</a></sub><br>
  <sub>Includes complexity metrics, security scanning, test coverage, and trend analysis</sub>
</div>

{self.ANALYSIS_MARKER_END}
"""
                  
                  return section
              
              def update_readme(self) -> bool:
                  """Main update function"""
                  try:
                      print("\n📝 Updating README.md...")
                      
                      content = self.read_existing_readme()
                      content = self.remove_old_analysis_section(content)
                      analysis_section = self.generate_analysis_section()
                      new_content = content + analysis_section
                      
                      with open(self.readme_path, 'w', encoding='utf-8') as f:
                          f.write(new_content)
                      
                      print("✅ README.md updated successfully!")
                      return True
                      
                  except Exception as e:
                      print(f"❌ Error updating README: {e}")
                      import traceback
                      traceback.print_exc()
                      return False

          if __name__ == "__main__":
              updater = AdvancedReadmeUpdater()
              success = updater.update_readme()
              exit(0 if success else 1)
          PYTHON_SCRIPT_EOF
          
          echo "✅ Advanced README updater created"
      
      - name: Update README
        continue-on-error: true
        run: python update_readme.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add README.md CHANGELOG.md .gitignore requirements.txt .github/.analysis_marker .github/analysis_history.json 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Advanced analysis update

- Analysis: $(date -u +"%Y-%m-%d %H:%M UTC")
- Errors: ${{ steps.analysis.outputs.error_count || 0 }}
- Security Issues: ${{ steps.analysis.outputs.security_issues || 0 }}
- Self-healing actions performed

[skip ci]"
            
            for i in {1..3}; do
              if git push; then
                echo "✅ Changes pushed"
                break
              else
                echo "⚠️  Retry $i/3"
                [ $i -lt 3 ] && sleep 5 && git pull --rebase || exit 1
              fi
            done
          fi
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: analysis-results-${{ github.run_number }}
          path: |
            analysis_results.json
            .github/analysis_history.json
            coverage.json
            install.log
          retention-days: 30
      
      - name: Create job summary
        if: always()
        run: |
          echo "## 📊 Advanced Analysis Summary" >> $GITHUB_STEP_SUMMARY
          
          if [ -f analysis_results.json ]; then
            python - << 'EOF'
          import json
          
          with open('analysis_results.json', 'r') as f:
              r = json.load(f)
          
          print(f"""
### ✅ Analysis Complete

#### 📈 Statistics
- Files Scanned: {r.get('analysis_metadata', {}).get('files_scanned', 0)}
- Lines of Code: {r.get('stats', {}).get('total_lines', 0):,}

#### 🎯 Results
- Errors: {len(r.get('errors', []))}
- Warnings: {len(r.get('warnings', []))}
- Security Issues: {len(r.get('security_issues', []))}

#### 📊 Code Quality
- Avg Complexity: {r.get('complexity_metrics', {}).get('average_complexity', 'N/A')}
- Maintainability: {r.get('complexity_metrics', {}).get('average_maintainability', 'N/A')}
- Test Coverage: {r.get('test_coverage', {}).get('coverage_percent', 0):.1f}%

#### 🔧 Self-Healing
- Actions: {len(r.get('self_healing_actions', []))}

#### 📦 Dependencies
- Python Outdated: {len(r.get('dependency_health', {}).get('python', {}).get('outdated', []))}
- Node Outdated: {len(r.get('dependency_health', {}).get('node', {}).get('outdated', []))}
""")
          EOF
          fi
